/* ===========================================================
   BACKGROUND
   The doorway interior is rebuilt from the door sprites themselves:
   the glass doors already show the store inside, so blitting them
   back into the cut-out hole and erasing their frame stiles/handles
   (columns copied from the neighbouring glass) yields the view
   behind the opened doors. (No bg.png / parts provided — see
   refs/chill-mart/spec.md.)
   =========================================================== */
const DL = CM_PARTS.door_l.states.base, DR = CM_PARTS.door_r.states.base;
const pb = PixelBuffer.fromImage(CM_BG);
pb.blit(DL, DL.ox, DL.oy);
pb.blit(DR, DR.ox, DR.oy);
for (let y = 96; y <= 123; y++) {
  const l = pb.gp(143, y), r = pb.gp(150, y);
  for (const x of [144, 145, 146]) pb.sp(x, y, l);
  for (const x of [147, 148, 149]) pb.sp(x, y, r);
}

/* ---- classify: pole-sign bulbs (chase), sign panels (flicker),
        sky stars (twinkle) ---- */
const lum = CM_PALETTE.map((c) => {
  if (c === 'none') return 0;
  const v = parseInt(c.slice(1), 16);
  return 0.299 * (v >> 16) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255);
});
const isBulb = CM_PALETTE.map((c) => {
  if (c === 'none') return false;
  const v = parseInt(c.slice(1), 16), r = v >> 16, g = (v >> 8) & 255, b = v & 255;
  return r > 180 && g > 140 && b < 150;
});
pb.toSVG(document.getElementById('bgG'), {
  layers: ['bulbsA', 'bulbsB', 'sign', 'starsA', 'starsB', 'starsC'],
  classify(x, y, o) {
    const c = pb.buf[o];
    const inSign = x >= 23 && x <= 62 && y >= 28 && y <= 88;
    if (inSign && isBulb[c]) return (x + y) % 2 ? 'bulbsA' : 'bulbsB';
    if (inSign) return 'sign';
    if (y < 52 && x > 62 && lum[c] > 140) return 'stars' + 'ABC'[(x * 7 + y * 13) % 3];
    return null;
  },
});

/* ---- occasional fluorescent stutter of the whole pole sign ---- */
const signG = document.getElementById('sign');
(function flicker() {
  if (REDUCED) return;
  const stutter = () => {
    signG.setAttribute('opacity', '0.7');
    setTimeout(() => signG.setAttribute('opacity', '1'), 50 + Math.random() * 80);
  };
  stutter();
  if (Math.random() < 0.35) setTimeout(stutter, 220); // double blink
  setTimeout(flicker, 3500 + Math.random() * 9000);
})();

/* ===========================================================
   DOORS — cutout sprites sliding into the wall (clipped)
   =========================================================== */
const doors = createSprites(document.getElementById('doorG'), CM_PARTS);
const SLIDE_MAX = 11;
let slide = 0;
let doorHold = Q.get('pose') === 'open';

function doorWanted() {
  return doorHold || people.some((p) => p.wantDoor);
}

/* ===========================================================
   PEOPLE — procedural customers (1-3 min) and rare passers-by.
   Movement follows the terrain: along the road at the bottom,
   then straight up the parking-lot aisle (the gap between the
   wheel stops) to the door — never through the fence or kerbs.
   Views: s0/s1 side (flip for left), b0/b1 back, f0/f1 front.
   =========================================================== */
const peopleG = document.getElementById('peopleG');
const DC = 147;                 // doorway centre x
const AX = DC - 5;              // sprite x when centred on the door aisle
const WALK_FY = 126;            // feet y on the storefront walkway
const STREET_FY = 184;          // feet y on the road along the bottom
const footY = (s) => s.y + 20;  // feet row; row 21 is the drop shadow
const SPEED = 18;               // px/s horizontal
const VSPEED = 13;              // px/s vertical (walking away/towards)
const people = [];

function spawnPerson(mode) {
  const variant = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
  const fromLeft = Math.random() < 0.5;
  const s = createSprite(peopleG, variant, { x: fromLeft ? -12 : 258, y: STREET_FY - 20 });
  s.setFlip(!fromLeft);
  const p = {
    sprite: s, mode, wantDoor: false, t: 0,
    dir: fromLeft ? 1 : -1,
    exitDir: Math.random() < 0.5 ? 1 : -1,
    dwell: 15000 + Math.random() * 30000,
  };
  people.push(p);
  return p;
}

function despawn(p) {
  p.sprite.remove();
  people.splice(people.indexOf(p), 1);
}

function updatePerson(p, dt) {
  const s = p.sprite;
  p.t += dt;
  const gait = (a, b) => s.setState(Math.floor(p.t / 170) % 2 ? a : b);

  if (p.mode === 'arriveStreet') {   // along the road towards the aisle
    s.moveBy(p.dir * SPEED * dt / 1000, 0);
    gait('s0', 's1');
    if ((p.dir > 0 && s.x >= AX) || (p.dir < 0 && s.x <= AX)) {
      s.moveTo(AX, s.y).setFlip(false);
      p.mode = 'arriveUp'; p.t = 0;
    }
  } else if (p.mode === 'arriveUp') { // straight up the aisle, back view
    s.moveBy(0, -VSPEED * dt / 1000);
    gait('b0', 'b1');
    if (footY(s) < 146) p.wantDoor = true;
    if (footY(s) <= WALK_FY) {
      s.moveTo(AX, WALK_FY - 20).setState('bs');
      p.mode = 'atDoor'; p.t = 0;
      if (!p.chimed) { p.chimed = true; chime(); }
    }
  } else if (p.mode === 'atDoor') {   // wait for the doors to part
    if (slide > SLIDE_MAX * 0.75 && p.t > 350) { p.mode = 'stepIn'; p.t = 0; }
  } else if (p.mode === 'stepIn') {   // step over the threshold
    s.moveTo(AX, WALK_FY - 20 - Math.min(3, p.t / 120));
    if (p.t > 450) {
      s.hide();
      p.wantDoor = false;
      p.mode = 'inside'; p.t = 0;
    }
  } else if (p.mode === 'inside') {
    if (p.t > p.dwell) {
      p.mode = 'stepOut'; p.t = 0;
      p.wantDoor = true; p.chimed = false;
    }
  } else if (p.mode === 'stepOut') {  // reappear facing the viewer
    if (slide > SLIDE_MAX * 0.75) {
      if (!p.chimed) { p.chimed = true; chime(); }
      s.moveTo(AX, WALK_FY - 23).setState('fs').setFlip(false).show();
      if (p.t > 350) { p.mode = 'leaveDown'; p.t = 0; }
    } else p.t = 0; // wait for the doors
  } else if (p.mode === 'leaveDown') { // straight down the aisle first
    s.moveBy(0, VSPEED * dt / 1000);
    gait('f0', 'f1');
    if (footY(s) > 146) p.wantDoor = false;
    if (footY(s) >= STREET_FY) {     // ...then turn left or right
      s.moveTo(AX, STREET_FY - 20).setFlip(p.exitDir < 0);
      p.mode = 'leaveStreet'; p.t = 0;
    }
  } else if (p.mode === 'leaveStreet' || p.mode === 'passing') {
    const d = p.mode === 'passing' ? p.dir : p.exitDir;
    s.moveBy(d * SPEED * dt / 1000, 0);
    gait('s0', 's1');
    if (s.x < -12 || s.x > 260) despawn(p);
  }
}

/* visit scheduling: 1-3 min (?visit=1 → first after 2 s) */
if (!REDUCED) {
  const nextVisit = () => {
    spawnPerson('arriveStreet');
    setTimeout(nextVisit, 60000 + Math.random() * 120000);
  };
  setTimeout(nextVisit, Q.get('visit') ? 2000 : 15000 + Math.random() * 45000);
  const nextPasser = () => {
    spawnPerson('passing');
    setTimeout(nextPasser, 120000 + Math.random() * 180000);
  };
  setTimeout(nextPasser, 50000 + Math.random() * 120000);
}
if (Q.get('walk')) { // debug: customer frozen at the doorway
  const p = spawnPerson('debug');
  p.sprite.moveTo(AX, WALK_FY - 20).setState('bs').setFlip(false);
  p.wantDoor = doorHold;
}

/* ===========================================================
   MAIN LOOP — door easing + people
   =========================================================== */
let lastT = 0;
function tick(now) {
  const dt = Math.min(100, now - lastT || 16);
  lastT = now;

  const target = doorWanted() ? SLIDE_MAX : 0;
  slide += (target - slide) * Math.min(1, dt / 140);
  if (Math.abs(target - slide) < 0.05) slide = target;
  doors.door_l.moveTo(DL.ox - slide, DL.oy);
  doors.door_r.moveTo(DR.ox + slide, DR.oy);

  for (const p of [...people]) updatePerson(p, dt);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===========================================================
   AUDIO — night ambience, hums, crickets, cars, door chime
   =========================================================== */
let engine = null;

function chime() {
  if (!engine || !engine.running) return;
  const ctx = engine.ctx, t = ctx.currentTime;
  [[932, 0], [740, 0.28]].forEach(([f, dt]) => {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(engine.master);
    g.gain.setValueAtTime(0, t + dt);
    g.gain.linearRampToValueAtTime(0.045, t + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0006, t + dt + 0.9);
    o.start(t + dt); o.stop(t + dt + 1);
  });
}

function startAudio(vol) {
  if (engine) return;
  engine = createAudioEngine(vol);
  const ctx = engine.ctx;

  // soft night wind
  const wind = engine.filteredNoise({ type: 'bandpass', freq: 420, Q: 0.8, gain: 0.015 });
  engine.schedule(() => {
    const d = 2.5 + Math.random() * 3.5;
    engine.ramp(wind.gain, 0.008 + Math.random() * 0.022, d);
    return d * 1000 + 600;
  }, 0, 0, 0);

  // fluorescent sign / vending machine hum
  const humG = ctx.createGain();
  humG.gain.value = 0.012;
  humG.connect(engine.master);
  [[118, 1], [236, 0.35]].forEach(([f, a]) => {
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = f;
    const g = ctx.createGain(); g.gain.value = a;
    o.connect(g); g.connect(humG); o.start();
  });

  // crickets
  engine.schedule(() => {
    const t0 = ctx.currentTime + 0.05;
    const n = 6 + Math.floor(Math.random() * 5);
    const o = ctx.createOscillator();
    o.type = 'sine'; o.frequency.value = 3900 + Math.random() * 700;
    const g = ctx.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(engine.master);
    for (let i = 0; i < n; i++) {
      const t = t0 + i * 0.075;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.016, t + 0.012);
      g.gain.linearRampToValueAtTime(0, t + 0.05);
    }
    o.start(t0); o.stop(t0 + n * 0.075 + 0.1);
  }, 1500, 5000);

  // distant car passing
  const car = engine.filteredNoise({ type: 'lowpass', freq: 600, gain: 0, brown: true });
  engine.schedule(() => {
    const t = ctx.currentTime;
    car.filter.frequency.setValueAtTime(500, t);
    car.filter.frequency.linearRampToValueAtTime(950, t + 1.8);
    car.filter.frequency.linearRampToValueAtTime(450, t + 4);
    car.gain.gain.setValueAtTime(0, t);
    car.gain.gain.linearRampToValueAtTime(0.05, t + 1.8);
    car.gain.gain.linearRampToValueAtTime(0, t + 4.2);
  }, 30000, 90000);
}
</script>
<script src="/shared/scene-ui.js"></script>
<script>
initSceneAudio({
  onStart(v)        { startAudio(v); },
  onStop()          { if (engine) { engine.stop(); engine = null; } },
  onVolumeChange(v) { if (engine) engine.setVolume(v); },
});
</script>
</body>
