    + '4A8F1A1F1A4F1A13F1A1F4A1F1A5F1A5F1A1F6A3F3A2E1A10E1A2F1A21F3A10F1A3F1A1F1A16F1A6F3A3F1A5F1A1F3A5F1A13F1A33F2A12F5A13F2A6F3A1F1E1A5F2A1F2A1F4A4F2A5E1A5F2A1F6A1F5A3F1A2F1A3F3A1F1A12E1F3A6F1A2F1A5F3A1F1A'
    + '13F3A1F3A2F3A5F1A8E1A4F1A1F1A1F1A6F1A1F2A2F2A5F1A7F1A3F1A10E1A6F5A17F5A1F4A11F3A16F1A1F2A4F1A3F1A3F2A2F8A10F1A1F1A8F1A17F4A1F3A6F2A13F7A2F1A2F2A1F1A3F1A2F1A19F4A6F4A3F3A7F1A9F1A4F1A2F1A4E1A9E1F1A6F1A2'
    + 'F1A18E1A14F1A13F1A1F2A20F1A2F1A3F2A4E2A6F1A9E1A13E1A4F1A8E1F1A5F2A15E1A3F1A23F1A8F4A11F1A6F1A1E1F4A1F1A19E2F1A1F1A2F1A16'
};

const W = CHILL_MART_IMG.w, H = CHILL_MART_IMG.h; // 320 x 240

/* ---- static storefront: image → pixel buffer → SVG ---- */
const pb = PixelBuffer.fromImage(CHILL_MART_IMG);
pb.toSVG(document.getElementById('sceneG'));

/* Debug hooks:
     ?people=1   frequent visitors (fast schedule)
     ?px=<n>     freeze a single standing person at feet-x <n> (scale check) */
const qp = new URLSearchParams(location.search);
const FORCE = qp.has('people');
const PX = qp.has('px') ? parseFloat(qp.get('px')) : null;

/* ---- subtle twinkling stars (a little life over the baked sky) ---- */
(function buildStars() {
  pb.seed(7391);
  const g = document.getElementById('starsG');
  let html = '';
  for (let i = 0; i < 12; i++) {
    const x = pb.ri(6, W - 6), y = pb.ri(6, 72);
    const c = pb.rn() < 0.4 ? '#f0f4ff' : '#c4d2f0';
    html += '<rect class="tw" x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c
      + '" style="animation-duration:' + (2.6 + pb.rn() * 3).toFixed(1)
      + 's;animation-delay:-' + (pb.rn() * 4).toFixed(1) + 's"/>';
  }
  g.innerHTML = html;
})();

/* ===========================================================
   LATE-NIGHT VISITORS — a lone customer arrives, steps inside,
   comes back out, and wanders off; then a long quiet gap. Never
   more than one figure on screen (深夜なので控えめに).
   =========================================================== */
const peopleG = document.getElementById('peopleG');
const FEET_Y = 173;      // apron/walkway level in front of the doors
const DOOR_X = 180;      // entrance centre
const DOOR_IN_Y = 150;   // feet level once stepped up into the doorway
const LEFT_X = -14, RIGHT_X = 334;
const WALK_SPEED = 20;   // px per second (unhurried night pace)

const HAIR  = ['#141018', '#1a1512', '#20180f', '#101014'];
const SKIN  = ['#c89a78', '#b98a66', '#caa583'];
const SHIRT = ['#9a4a44', '#3f5f86', '#575760', '#6f6a4a', '#7a4f74', '#4a7a6a', '#8a7350'];
const PANTS = ['#26262d', '#2a2622', '#22242a'];
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function newColors() { return { hair: pick(HAIR), skin: pick(SKIN), shirt: pick(SHIRT), pants: pick(PANTS) }; }

/* Sprite rects, origin at feet-centre, facing right. step 0/1 = leg frame. */
function personRects(step, c) {
  const H_ = c.hair, S = c.skin, T = c.shirt, P = c.pants, Sh = '#0d0d11';
  const r = [
    [-2, -26, 4, 3, H_], [-2, -24, 4, 1, H_], [-2, -23, 4, 3, S], // head + fringe + face
    [-3, -21, 6, 9, T],                                           // torso
    [-4, -20, 1, 6, T], [-4, -14, 1, 1, S],                       // back arm + hand
    [3, -20, 1, 6, T], [3, -14, 1, 1, S],                         // front arm + hand
  ];
  if (step === 0) {
    r.push([-3, -12, 2, 12, P], [1, -12, 2, 12, P], [-4, -2, 3, 2, Sh], [1, -2, 3, 2, Sh]);
  } else {
    r.push([-2, -12, 3, 12, P], [-2, -2, 4, 2, Sh]);
  }
  return r;
}
function personHTML(step, c) {
  let s = '';
  for (const [x, y, w, h, col] of personRects(step, c)) {
    s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + col + '"/>';
  }
  return s;
}
function drawPerson(px, py, dir, step, col, alpha) {
  const sh = '<rect x="-4" y="0" width="8" height="1" fill="#000" opacity="' + (0.22 * alpha).toFixed(2) + '"/>';
  peopleG.innerHTML =
    '<g transform="translate(' + px.toFixed(1) + ',' + py.toFixed(1) + ')" opacity="' + alpha.toFixed(2) + '">'
    + sh + '<g transform="scale(' + dir + ',1)">' + personHTML(step, col) + '</g></g>';
}
function smooth(k) { return k * k * (3 - 2 * k); }

const STEP_RATE = 2.2; // leg swaps (and footfalls) per second — an unhurried stroll
const P = {
  st: 'away',
  next: FORCE ? 1.5 : 6 + Math.random() * 10,
  x: 0, startX: 0, dir: 1, col: newColors(), t0: 0, until: 0, lastStep: -1,
};

function walkStep(now) { return Math.floor(now * STEP_RATE) % 2; }

// Emit a footstep each time the leg frame swaps while walking on the ground.
function footfall(now) {
  const st = walkStep(now);
  if (st !== P.lastStep) { P.lastStep = st; playFootstep(); }
  return st;
}

function updPeople(now) {
  if (PX !== null) { drawPerson(PX, FEET_Y, 1, 0, P.col, 1); return; } // debug pose

  switch (P.st) {
    case 'away':
      peopleG.innerHTML = '';
      if (now >= P.next) {
        const fromLeft = Math.random() < 0.5;
        P.startX = fromLeft ? LEFT_X : RIGHT_X;
        P.dir = fromLeft ? 1 : -1;
        P.col = newColors();
        P.t0 = now;
        P.st = 'approach';
      }
      break;

    case 'approach':
      // position is a pure function of elapsed time (robust under frame drops)
      P.x = P.startX + P.dir * WALK_SPEED * (now - P.t0);
      drawPerson(P.x, FEET_Y, P.dir, footfall(now), P.col, 1);
      if ((P.dir > 0 && P.x >= DOOR_X) || (P.dir < 0 && P.x <= DOOR_X)) {
        P.x = DOOR_X; P.st = 'enter'; P.t0 = now; doorGreeting();
      }
      break;

    case 'enter': {
      const k = Math.min(1, (now - P.t0) / 1.0);
      const e = smooth(Math.max(0, (k - 0.25) / 0.75)); // brief pause, then step in
      drawPerson(DOOR_X, FEET_Y + (DOOR_IN_Y - FEET_Y) * e, P.dir, walkStep(now), P.col, 1 - e);
      if (k >= 1) { P.st = 'inside'; P.until = now + 4 + Math.random() * 7; }
      break;
    }

    case 'inside':
      peopleG.innerHTML = '';
      if (now >= P.until) { P.st = 'exit'; P.t0 = now; P.col = newColors(); P.dir = Math.random() < 0.5 ? 1 : -1; doorGreeting(); }
      break;

    case 'exit': {
      const k = Math.min(1, (now - P.t0) / 1.0);
      const e = smooth(Math.min(1, k / 0.75));
      drawPerson(DOOR_X, DOOR_IN_Y + (FEET_Y - DOOR_IN_Y) * e, P.dir, walkStep(now), P.col, Math.min(1, k / 0.4));
      if (k >= 1) { P.st = 'leave'; P.startX = DOOR_X; P.t0 = now; }
      break;
    }

    case 'leave':
      P.x = P.startX + P.dir * WALK_SPEED * (now - P.t0);
      drawPerson(P.x, FEET_Y, P.dir, footfall(now), P.col, 1);
      if (P.x < LEFT_X || P.x > RIGHT_X) { P.st = 'away'; P.next = now + (FORCE ? 4 : 15 + Math.random() * 22); }
      break;
  }
}

/* ---- animation loop ---- */
function tick(nowMs) {
  updPeople(nowMs / 1000);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===========================================================
   AUDIO — quiet roadside konbini at night: distant rumble,
   the fridge/fluorescent electric hum, sparse crickets, the odd
   passing car, plus the customer's footsteps, the automatic-door
   slide and the "pin-pon" entrance chime. Event sounds are routed
   through a low-passed, attenuated "far" bus so they read as coming
   from across the parking lot rather than up close (引きの視点).
   =========================================================== */
let engine = null;
let sfxBus = null; // low-passed, attenuated bus → everything on it sounds distant

// Entrance chime: two descending tones, "pin" (higher) then "pon" (lower, ringing).
function playChime() {
  if (!engine) return;
  const ac = engine.ctx, t = ac.currentTime;
  const notes = [[988, 0.0, 0.5], [784, 0.19, 0.62]];
  for (const [f, off, dur] of notes) {
    const s = t + off;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = 'sine'; osc.frequency.value = f;
    g.gain.setValueAtTime(0, s);
    g.gain.linearRampToValueAtTime(0.11, s + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
    osc.connect(g); g.connect(sfxBus); osc.start(s); osc.stop(s + dur + 0.05);
    // faint higher partial for a bell-like sheen
    const o2 = ac.createOscillator(), g2 = ac.createGain();
    o2.type = 'sine'; o2.frequency.value = f * 2.01;
    g2.gain.setValueAtTime(0, s);
    g2.gain.linearRampToValueAtTime(0.028, s + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, s + dur * 0.7);
    o2.connect(g2); g2.connect(sfxBus); o2.start(s); o2.stop(s + dur);
  }
}

// Automatic sliding door: a soft motorised "shhhk" with a gentle bandpass
// sweep, ending in a faint settle-thunk. opening=true slides apart, false shut.
function playDoorSlide(opening) {
  if (!engine) return;
  const ac = engine.ctx, t = ac.currentTime, dur = 0.55;
  const src = engine.whiteNoiseSrc();
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 1.1;
  bp.frequency.setValueAtTime(opening ? 850 : 1250, t);
  bp.frequency.linearRampToValueAtTime(opening ? 1250 : 780, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.04, t + 0.08);
  g.gain.setValueAtTime(0.04, t + dur - 0.12);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + dur + 0.05);
  // soft mechanical settle at the end of travel
  const tt = t + dur - 0.03, o = ac.createOscillator(), og = ac.createGain();
  o.type = 'sine'; o.frequency.value = 150;
  og.gain.setValueAtTime(0.0001, tt);
  og.gain.linearRampToValueAtTime(0.028, tt + 0.01);
  og.gain.exponentialRampToValueAtTime(0.0001, tt + 0.12);
  o.connect(og); og.connect(sfxBus); o.start(tt); o.stop(tt + 0.14);
}

// A door trigger: slides open, chimes just after, then slides shut once the
// customer has passed through (~1 s later, matching the enter/exit animation).
function doorGreeting() {
  if (!engine) return;
  playDoorSlide(true);
  engine.later(() => playChime(), 260);
  engine.later(() => playDoorSlide(false), 1050);
}

// A single soft footstep on the asphalt — dull, quiet, distant.
function playFootstep() {
  if (!engine) return;
  const ac = engine.ctx, t = ac.currentTime;
  const src = engine.whiteNoiseSrc();
  const lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 640 + Math.random() * 200;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.03, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  src.connect(lp); lp.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + 0.1);
  // faint low thump for weight
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = 'sine'; o.frequency.value = 82 + Math.random() * 16;
  og.gain.setValueAtTime(0.0001, t);
  og.gain.linearRampToValueAtTime(0.02, t + 0.006);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(og); og.connect(sfxBus); o.start(t); o.stop(t + 0.1);
}

function playCricket(amp) {
  const ac = engine.ctx, t = ac.currentTime;
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    const s = t + i * 0.055;
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = 'sine'; osc.frequency.value = 4650 + Math.random() * 450;
    g.gain.setValueAtTime(0, s);
    g.gain.linearRampToValueAtTime(amp, s + 0.004);
    g.gain.setValueAtTime(amp, s + 0.03);
    g.gain.linearRampToValueAtTime(0, s + 0.042);
    osc.connect(g); g.connect(engine.master); osc.start(s); osc.stop(s + 0.05);
  }
}

function playCarPass() {
  const ac = engine.ctx, t = ac.currentTime;
  const src = engine.whiteNoiseSrc();
  const bp = ac.createBiquadFilter();
  bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.setValueAtTime(260, t);
  const g = ac.createGain(); g.gain.setValueAtTime(0, t);
  const dur = 3.6 + Math.random() * 2.2, mid = t + dur * 0.5;
  g.gain.linearRampToValueAtTime(0.05, mid);
  g.gain.linearRampToValueAtTime(0.0001, t + dur);
  bp.frequency.linearRampToValueAtTime(1150, mid); // approaching → brighter
  bp.frequency.linearRampToValueAtTime(200, t + dur); // receding → duller
  src.connect(bp); bp.connect(g); g.connect(sfxBus);
  src.start(t); src.stop(t + dur + 0.1);
}

function startAudio(vol) {
  if (engine) return;
  engine = createAudioEngine(vol);
  const ac = engine.ctx;

  // "Far" bus: attenuated + rolled-off highs so events sound across the lot
  sfxBus = ac.createGain();
  sfxBus.gain.value = 0.85;
  const sfxLP = ac.createBiquadFilter();
  sfxLP.type = 'lowpass'; sfxLP.frequency.value = 2700; sfxLP.Q.value = 0.5;
  sfxBus.connect(sfxLP); sfxLP.connect(engine.master);

  // Distant town/road rumble
  engine.filteredNoise({ type: 'lowpass', freq: 220, Q: 0.6, gain: 0.022, brown: true });
  // Electric hum — fridge cases, vending machine, fluorescent lights
  for (const [f, a] of [[100, 0.010], [200, 0.006], [60, 0.006]]) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f; g.gain.value = a;
    o.connect(g); g.connect(engine.master); o.start();
  }
  // Sparse crickets
  engine.schedule(() => {
    if (Math.random() < 0.7) playCricket(0.05 + Math.random() * 0.03);
    return 2500 + Math.random() * 3800;
  }, 0, 0, 1500);
  // The occasional car passing on the road
  engine.schedule(() => {
    if (Math.random() < 0.7) playCarPass();
    return 22000 + Math.random() * 30000;
  }, 0, 0, 12000);
}
</script>
<script src="/shared/scene-ui.js"></script>
<script>
initSceneAudio({
  onStart(v)        { startAudio(v); },
  onStop()          { if (engine) { engine.stop(); engine = null; sfxBus = null; } },
  onVolumeChange(v) { if (engine) engine.setVolume(v); },
});
</script>
