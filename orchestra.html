    + '1C1B4P2B2C1D1P1B1A4J1L1D2B1C1F1C2B2D2B3P2A3H1B1D1B2F2B1F2C2B1H1B5A2G2D1B1F2B2F3B2H1C1B1C1B1F2G2C2B2F1C1F3G1D1B1L1B1D1C1B1F1B1C1J1B4C1B1F3D1B2I1B1D1C1E1B1F1B1H1L1C1B3F3D2B2L1C1D1B1E1F2C2B3E1D1F3D1C5B2F'
    + '3B3F5C1F1N1B2C1B1A2B1F3A1B1F3B1F4B2D2B1A2B1E2F1A1B1F3B1F4D1C1D1B2A3B1F2A1B1F3B1F4D1B1D1B1A5C1E1A1D1B1F1B1F4D1C1B1D1C1A6B1A2B4F2E1B1C1B1C1B1A10C1B5A2B1C1A13B1A15' },
  } },
  cello3_bow: { z: 63, states: {
    base: { w: 5, h: 4, ox: 120, oy: 107, palette: ORCHESTRA_PALETTE,
      data: 'P1A4P1A5O2N1A5O1' },
  } },
  cello4: { z: 64, states: {
    base: { w: 23, h: 30, ox: 130, oy: 87, palette: ORCHESTRA_PALETTE,
      data: 'A2C1B3A1B3E1A13B1D4C1L1B1E1B2A11B1D5B4P1O1B1A10D8B4P2A9D2C2D3B1P2C1B3O1A8D1C1P2O1C1D1B1P2C1B1D1B2C1A7C1O5B1C2B1D3B1E1B2A6C1P1B1P1C1B1O1B1E1B1C1B2E1B1F3A5B1O1P1O2P1O1B1F1B2D1B1F6A4B1P2O2C1B2F1B1C1B2F4E'
    + '1D1F1A3B3O1P1B3G1B1D1B2F4B1D1F2A2B8F1B1G2B1D1F1E1F1B2F3A1B1D1C2B1F2B1G1B1F1G1E1B1F1E3B1F4A1D1C2F3B1F1B1E1F2D1B1E3B1E2C2A2B2F3B1F1B1E1F2D1B8A4B2E2B1F1B1F4B2A1B4A6B1E2B1F1D1E1F1B3A2C2A9B2D2E2F2B1A15B1D2'
    + 'E1B1F2C1B1A15B1E1D2F2C2B1A14B1E1F2B2F1C1B1A14F3E1B1F1G1C1B2A13F7D1B2A13F1C1F5D1B2A13F1B1D1F4D1B2A13F1B1E1F1E1F1D1B2A14E1B1E3D2B1A15E1B1E1B1E1D1B1A16B4C1B1A19B1A13' },
  } },
  cello4_bow: { z: 65, states: {
    base: { w: 6, h: 4, ox: 135, oy: 104, palette: ORCHESTRA_PALETTE,
      data: 'P1A6P2A6O2A6O1' },
  } },
};

const Q = new URLSearchParams(location.search);
const POSE = Q.get('pose') || '';
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// declared up here because the ?at= fast-forward below runs the tuning
// state machine while this script is still evaluating
let engine = null, bus = null;

/* ---- static stage ---- */
PixelBuffer.fromImage(ORCHESTRA_BG).toSVG(document.getElementById('bgG'));

/* ---- musicians + bows as sprites (z-sorted) ---- */
const sprites = createSprites(document.getElementById('partsG'), ORCHESTRA_PARTS);

/* ===========================================================
   THE PLAYERS

   Open strings only — this is a tuning session, so every pitch is
   an open string of the instrument the figure is holding, with A
   (the oboe's reference) by far the most common.
   =========================================================== */
// p = the pitches this family reaches for (open strings, low → high),
// A = its A, w = how many extra times A goes into the pool (the whole hall
// is chasing the same A), str = bows an actual string, so it can double-stop
const NOTES = {
  violin: { p: [196.00, 293.66, 440.00, 659.25], A: 440.00, w: 3, g: 0.030, bright: 6.0, str: 1 },
  viola:  { p: [130.81, 196.00, 293.66, 440.00], A: 440.00, w: 3, g: 0.030, bright: 5.5, str: 1 },
  cello:  { p: [65.41, 98.00, 146.83, 220.00],   A: 220.00, w: 3, g: 0.034, bright: 7.0, str: 1 },
  bass:   { p: [41.20, 55.00, 73.42, 98.00],     A: 55.00,  w: 2, g: 0.036, bright: 8.0, str: 1 },
  wind:   { p: [293.66, 440.00, 587.33],         A: 440.00, w: 4, g: 0.022, bright: 4.0 },
  brass:  { p: [55.00, 73.42, 110.00],           A: 110.00, w: 2, g: 0.026, bright: 5.0 },
  harp:   { p: [261.63, 293.66, 329.63, 392.00, 523.25], A: 440.00, w: 3, g: 0.030 },
  timp:   { p: [49.00, 73.42],                   A: 55.00,  w: 2, g: 0.050 },
};

const ROSTER = [
  ['harpist', 'harp'], ['timpanist', 'timp'], ['bassdrum', null], ['tubist', 'brass'],
  ['wind1', 'wind'], ['wind2', 'wind'], ['wind3', 'wind'], ['wind4', 'wind'],
  ['wind5', 'wind'], ['wind6', 'wind'],
  ['mid1', 'wind'], ['mid2', 'wind'], ['mid3', 'wind'], ['mid4', 'wind'],
  ['mid5', 'wind'], ['mid6', 'wind'],
  ['bassist', 'bass'],
  ['vln1', 'violin'], ['vln2', 'violin'], ['vln3', 'violin'], ['vln4', 'violin'],
  ['vln5', 'viola'], ['vln6', 'viola'], ['vln7', 'viola'],
  ['cello1', 'cello'], ['cello2', 'cello'], ['cello3', 'cello'], ['cello4', 'cello'],
];

/** Principal axis of a bow sprite → the direction the bow slides in. */
function bowAxis(img) {
  const buf = PixelBuffer.decodeRLE(img.data);
  const skip = img.palette.indexOf('none');
  let n = 0, mx = 0, my = 0;
  const pts = [];
  for (let y = 0; y < img.h; y++) {
    for (let x = 0; x < img.w; x++) {
      if (buf[y * img.w + x] === skip) continue;
      pts.push(x, y); mx += x; my += y; n++;
    }
  }
  if (n < 2) return [1, 0];
  mx /= n; my /= n;
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < pts.length; i += 2) {
    const dx = pts[i] - mx, dy = pts[i + 1] - my;
    sxx += dx * dx; sxy += dx * dy; syy += dy * dy;
  }
  // dominant eigenvector of [[sxx,sxy],[sxy,syy]]
  const tr = sxx + syy, det = sxx * syy - sxy * sxy;
  const l = tr / 2 + Math.sqrt(Math.max(0, tr * tr / 4 - det));
  let vx = sxy, vy = l - sxx;
  if (Math.abs(sxy) < 1e-6) { vx = sxx >= syy ? 1 : 0; vy = sxx >= syy ? 0 : 1; }
  const m = Math.hypot(vx, vy) || 1;
  vx /= m; vy /= m;
  if (vx < 0) { vx = -vx; vy = -vy; }               // always point right
  return [Math.round(vx), Math.round(vy)];          // -1 / 0 / 1 steps
}

let rnd = 0;
const rand = () => { rnd = (rnd * 1664525 + 1013904223) >>> 0; return rnd / 4294967296; };
rnd = 20240724;

const PLAYERS = ROSTER.map(([id, fam]) => {
  const s = sprites[id];
  const bow = sprites[id + '_bow'] || null;
  const st = ORCHESTRA_PARTS[id].states.base;
  return {
    id, fam, s, bow,
    hx: s.x, hy: s.y,
    bhx: bow ? bow.x : 0, bhy: bow ? bow.y : 0,
    axis: bow ? bowAxis(ORCHESTRA_PARTS[id + '_bow'].states.base) : [1, 0],
    // stage position → stereo image (the hall seen from the audience)
    pan: Math.max(-0.8, Math.min(0.8, ((st.ox + st.w / 2) / 160 - 0.5) * 1.7)),
    // idle sway: everyone breathes at their own rate
    w1: 1.2 + rand() * 1.1, p1: rand() * 6.28,
    w2: 0.8 + rand() * 0.9, p2: rand() * 6.28,
    // how often this one reaches for their strings — keeps the murmur
    // from falling into lockstep after a tutti
    eager: 0.5 + rand() * 1.2,
    playing: false, next: rand() * 22, bowHz: 1, bowPh: 0,
  };
});

/* ===========================================================
   TUNING STATE MACHINE — drives both the sprites and the audio
   =========================================================== */
// the oboe's A goes out every minute or so and the whole stage answers it;
// now and then a section swells on its own without being asked
let tuttiUntil = 0, nextTutti = 55 + Math.random() * 70;
let nextRefA = 3;

function restLen(pl) {
  const base = pl.fam === 'timp' ? 25 : pl.fam === 'harp' ? 12 : 3.5;
  return (base + Math.random() * (base + 16)) * pl.eager;
}

function startNote(pl, t) {
  pl.playing = true;
  pl.bowHz = 0.75 + Math.random() * 0.9;
  pl.bowPh = Math.random() * 6.28;
  const N = NOTES[pl.fam];
  const dur = pl.fam === 'timp' ? 1.2
    : pl.fam === 'harp' ? 2.2 + Math.random() * 2
    : 2.5 + Math.random() * 4.5;
  pl.next = t + dur;
  if (!engine || !engine.running) return;
  // A is the centre of gravity; everything else is a neighbouring string
  const pool = N.p.concat(Array(N.w).fill(N.A));
  const f = pool[Math.floor(Math.random() * pool.length)];
  if (pl.fam === 'harp') pluck(f, pl.pan, N.g);
  else if (pl.fam === 'timp') timpani(f, pl.pan, N.g);
  else {
    bowed(f, dur, pl.pan, N.g, N.bright);
    // open fifths — the classic "tune two strings at once" double stop
    if (N.str && Math.random() < 0.28) {
      const i = N.p.indexOf(f);   // every str family's A is one of its p
      const j = i > 0 && Math.random() < 0.5 ? i - 1 : i + 1;
      if (N.p[j]) bowed(N.p[j], dur * 0.85, pl.pan, N.g * 0.8, N.bright);
    }
  }
}

/* ---- animation ---- */
function step(t) {
  if (t > nextTutti) { tuttiUntil = t + 5 + Math.random() * 4; nextTutti = t + 80 + Math.random() * 70; }
  if (t > nextRefA) { referenceA(); nextRefA = t + 42 + Math.random() * 34; tuttiUntil = Math.max(tuttiUntil, t + 6); }

  for (const pl of PLAYERS) {
    if (!pl.fam) continue;
    if (t >= pl.next) {
      // during a tutti nobody waits long before the next A
      if (pl.playing) { pl.playing = false; pl.next = t + (t < tuttiUntil ? 0.3 + Math.random() * 0.6 : restLen(pl)); }
      else startNote(pl, t);
    }
  }

  for (const pl of PLAYERS) {
    // amplitudes sit just above 0.5 so rounding yields an occasional 1px
    // lean rather than a constant jitter; playing leans a little more
    const amp = pl.playing ? 1 : 0.85;
    const dx = Math.round(amp * 0.62 * Math.sin(t * pl.w2 + pl.p2));
    const dy = Math.round(amp * 0.72 * Math.sin(t * pl.w1 + pl.p1));
    pl.s.moveTo(pl.hx + dx, pl.hy + dy);
    if (pl.bow) {
      let s = 0;
      if (pl.playing) s = Math.round(1.6 * Math.sin(t * 6.283 * pl.bowHz + pl.bowPh));
      pl.bow.moveTo(pl.bhx + dx + s * pl.axis[0], pl.bhy + dy + s * pl.axis[1]);
    }
  }
}

function frame(now) { step(now / 1000); requestAnimationFrame(frame); }

/* ---- debug poses: freeze a state so it can be screenshot-verified ---- */
function pose(kind) {
  for (const pl of PLAYERS) {
    if (kind === 'lift') {
      pl.s.moveTo(pl.hx - 5, pl.hy - 12);
      if (pl.bow) pl.bow.moveTo(pl.bhx - 5, pl.bhy - 12);
    } else if (kind === 'bow') {
      pl.s.moveTo(pl.hx, pl.hy + 1);
      if (pl.bow) pl.bow.moveTo(pl.bhx + 2 * pl.axis[0], pl.bhy + 1 + 2 * pl.axis[1]);
    } else {
      pl.s.moveHome();
      if (pl.bow) pl.bow.moveHome();
    }
  }
}

if (POSE) pose(POSE);
else if (REDUCED) pose('home');
else if (Q.has('at')) {
  // ?at=<seconds>: fast-forward the tuning session and hold that frame,
  // so any moment of it can be captured reproducibly
  const end = parseFloat(Q.get('at')) || 0;
  for (let t = 0; t <= end; t += 1 / 60) step(t);
} else requestAnimationFrame(frame);

/* ===========================================================
   AUDIO — a hall full of open strings finding the same A
   =========================================================== */

/** Noise-burst impulse response — the hall's tail. */
function hallReverb(ctx, sec, decay) {
  const len = Math.floor(ctx.sampleRate * sec);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
  }
  const conv = ctx.createConvolver();
  conv.buffer = buf;
  return conv;
}

/** Route a voice through its stage position into the hall bus. */
function place(node, pan) {
  const ctx = engine.ctx;
  if (ctx.createStereoPanner) {
    const p = ctx.createStereoPanner();
    p.pan.value = pan;
    node.connect(p); p.connect(bus);
  } else {
    node.connect(bus);
  }
}

/** A bowed open string: two detuned saws + a sine body, soft attack. */
function bowed(freq, dur, pan, peak, bright) {
  if (!engine || !engine.running) return;
  const ctx = engine.ctx, t = ctx.currentTime + 0.02;
  const det = (Math.random() * 2 - 1) * 13;          // cents — the beating
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = Math.min(3400, Math.max(600, freq * bright));
  lp.Q.value = 0.9;
  const g = ctx.createGain();
  g.gain.value = 0;
  lp.connect(g);
  place(g, pan);

  const oscs = [];
  [[det, 'sawtooth', 0.5], [-det - 5, 'sawtooth', 0.42], [0, 'sine', 0.5]].forEach(([d, type, amt]) => {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.value = freq; o.detune.value = d;
    const og = ctx.createGain(); og.gain.value = amt;
    o.connect(og); og.connect(lp);
    o.start(t); oscs.push(o);
  });
  // bow pressure waver (open strings get no vibrato)
  const lfo = ctx.createOscillator();
  lfo.type = 'sine'; lfo.frequency.value = 3.6 + Math.random() * 2.4;
  const lg = ctx.createGain(); lg.gain.value = peak * 0.16;
  lfo.connect(lg); lg.connect(g.gain);
  lfo.start(t); oscs.push(lfo);

  const att = 0.10 + Math.random() * 0.16, rel = 0.35 + Math.random() * 0.4;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + att);
  g.gain.setValueAtTime(peak, t + dur);
  g.gain.linearRampToValueAtTime(0, t + dur + rel);
  oscs.forEach((o) => o.stop(t + dur + rel + 0.05));
}

/** The oboe's reference A — clear, straight, a little louder. */
function referenceA() {
  if (!engine || !engine.running) return;
  const ctx = engine.ctx, t = ctx.currentTime + 0.05;
  const dur = 3.6 + Math.random() * 2.4;
  const bp = ctx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 1350; bp.Q.value = 2.2;
  const g = ctx.createGain(); g.gain.value = 0;
  bp.connect(g);
  place(g, 0.05);
  const oscs = [];
  [['sawtooth', 0.55, 0], ['square', 0.16, 4], ['sine', 0.3, -3]].forEach(([type, amt, d]) => {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.value = 440; o.detune.value = d;
    const og = ctx.createGain(); og.gain.value = amt;
    o.connect(og); og.connect(bp);
    o.start(t); oscs.push(o);
  });
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.05, t + 0.22);
  g.gain.setValueAtTime(0.05, t + dur);
  g.gain.linearRampToValueAtTime(0, t + dur + 0.5);
  oscs.forEach((o) => o.stop(t + dur + 0.6));
}

/** Harp string, checked one at a time. */
function pluck(freq, pan, peak) {
  if (!engine || !engine.running) return;
  const ctx = engine.ctx, t = ctx.currentTime + 0.02;
  const g = ctx.createGain(); g.gain.value = 0;
  place(g, pan);
  const oscs = [];
  [['triangle', 1, 0], ['sine', 0.5, 1200]].forEach(([type, amt, d]) => {
    const o = ctx.createOscillator();
    o.type = type; o.frequency.value = freq; o.detune.value = d;
    const og = ctx.createGain(); og.gain.value = amt;
    o.connect(og); og.connect(g);
    o.start(t); oscs.push(o);
  });
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0004, t + 1.8);
  oscs.forEach((o) => o.stop(t + 2));
}

/** Soft timpani tap while the pedal is being felt out. */
function timpani(freq, pan, peak) {
  if (!engine || !engine.running) return;
  const ctx = engine.ctx, t = ctx.currentTime + 0.02;
  const g = ctx.createGain(); g.gain.value = 0;
  place(g, pan);
  const o = ctx.createOscillator();
  o.type = 'sine'; o.frequency.setValueAtTime(freq * 1.06, t);
  o.frequency.exponentialRampToValueAtTime(freq, t + 0.25);
  o.connect(g);
  const n = engine.whiteNoiseSrc(0.4);
  const nf = ctx.createBiquadFilter();
  nf.type = 'lowpass'; nf.frequency.value = 260;
  const ng = ctx.createGain(); ng.gain.value = peak * 0.5;
  n.connect(nf); nf.connect(ng); ng.connect(g);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0005, t + 1.4);
  ng.gain.setValueAtTime(peak * 0.5, t);
  ng.gain.exponentialRampToValueAtTime(0.0002, t + 0.18);
  o.start(t); o.stop(t + 1.5);
  n.start(t); n.stop(t + 0.3);
}

/** Chair creaks, page turns, a cough from somewhere in the section. */
function roomSound() {
  if (!engine || !engine.running) return;
  const ctx = engine.ctx, t = ctx.currentTime + 0.02;
  const kind = Math.random();
  const n = engine.whiteNoiseSrc(1);
  const f = ctx.createBiquadFilter();
  const g = ctx.createGain(); g.gain.value = 0;
  n.connect(f); f.connect(g);
  place(g, (Math.random() * 2 - 1) * 0.7);
  if (kind < 0.4) {                                   // chair creak
    f.type = 'bandpass'; f.Q.value = 6;
    f.frequency.setValueAtTime(320, t);
    f.frequency.linearRampToValueAtTime(560, t + 0.35);
    g.gain.linearRampToValueAtTime(0.014, t + 0.06);
    g.gain.linearRampToValueAtTime(0, t + 0.4);
    n.start(t); n.stop(t + 0.45);
  } else if (kind < 0.75) {                           // page turn
    f.type = 'highpass'; f.frequency.value = 2600;
    g.gain.linearRampToValueAtTime(0.02, t + 0.02);
    g.gain.linearRampToValueAtTime(0, t + 0.16);
    n.start(t); n.stop(t + 0.2);
  } else {                                            // distant cough
    f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.value = 480;
    g.gain.linearRampToValueAtTime(0.02, t + 0.03);
    g.gain.linearRampToValueAtTime(0.004, t + 0.12);
    g.gain.linearRampToValueAtTime(0, t + 0.3);
    n.start(t); n.stop(t + 0.35);
  }
}

function startAudio(vol) {
  if (engine) return;
  engine = createAudioEngine(vol, { scale: 0.6 });
  const ctx = engine.ctx;

  // voices → hall bus → (dry + reverb) → soft limiter → master, so a
  // full tutti of twenty-odd open strings still sits under the ceiling
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -17; comp.knee.value = 12; comp.ratio.value = 4;
  comp.attack.value = 0.02; comp.release.value = 0.35;
  comp.connect(engine.master);
  const conv = hallReverb(ctx, 2.4, 2.6);
  const wet = ctx.createGain(); wet.gain.value = 0.55;
  conv.connect(wet); wet.connect(comp);
  bus = ctx.createGain(); bus.gain.value = 0.9;
  bus.connect(comp); bus.connect(conv);

  // the room itself: air, and the low rumble of a big empty hall
  engine.filteredNoise({ type: 'bandpass', freq: 640, Q: 0.4, gain: 0.006 });
  engine.filteredNoise({ type: 'lowpass', freq: 110, gain: 0.02, brown: true });

  engine.schedule(roomSound, 9000, 26000);
  if (Q.get('a') === '1') engine.later(referenceA, 300);
}
</script>
<script src="/shared/scene-ui.js"></script>
<script>
initSceneAudio({
  onStart(v)        { startAudio(v); },
  onStop()          { if (engine) { engine.stop(); engine = null; bus = null; } },
  onVolumeChange(v) { if (engine) engine.setVolume(v); },
});
</script>
