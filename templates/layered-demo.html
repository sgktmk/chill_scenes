<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layered Pipeline Demo — Chill Scenes</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06080e}
body{display:flex;align-items:center;justify-content:center;font-family:monospace;color:#cdc}
#scene-wrap{
  position:relative;
  width:100vw;height:66.667vw;
  max-height:100vh;max-width:150vh;
  overflow:hidden;cursor:default;
}
#scene-wrap svg{
  display:block;width:100%;height:100%;
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}
svg rect{shape-rendering:crispEdges}
#label{position:fixed;left:10px;bottom:8px;font-size:11px;opacity:.6}
</style>
</head>
<body>
<div id="scene-wrap">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<div id="label">layered pipeline demo — refs/_fixture-train (?pose=0..1 freezes)</div>

<script src="/shared/pixel.js"></script>
<script>
/* ===========================================================
   Demo of the layered image-to-scene pipeline. Proves that
   partial animation works STRUCTURALLY (real layers + paint-order
   occlusion), not as a visual trick:
     - scenery scrolls BEHIND the transparent window aperture
     - the door slides BEHIND the wall (auto-cut hole in `cabin`)
     - the strap swings around its manifest-declared pivot

   Data below is generated — do not hand-edit. Regenerate with:
     node refs/_fixture-train/make-fixture.mjs
     node tools/png2pixel.mjs --manifest refs/_fixture-train/layers.json
   =========================================================== */
// Generated by tools/png2pixel.mjs --manifest from _fixture-train/ (120x80, 11 colours, 5 layers)
// Layer order = paint order (first is the back). Render with
// PixelBuffer.sceneToSVG(svgEl, FIXTURE_TRAIN) — see shared/pixel.js.
const FIXTURE_TRAIN = {
  w: 120, h: 80,
  palette: ['none', '#607957', '#7b785e', '#78a860', '#98a0ac', '#b9b09f', '#9abbd3', '#96caeb', '#c8beac', '#e4e2da', '#f0f8fc'],
  layers: [
    { id: "sky", role: "background" },
    { id: "scenery", role: "movable", motion: "scroll-x: loops left, pattern repeats every 120px", x: 0, y: 0, w: 240, h: 80,
      data: 'H1466K9H111K9H111K9H111K9H105K21H99K21H99K21H99K21H99K21H99K21H99K21H99K21H99K21H99K21H877K15H105K15H105K15H105K15H35B2H38B2H28K10B2K3H35B2H38B2H28K10B2K3H35B2H38B2H28K10B2K3H35B2H38B2H28K10'
        + 'B2K3H31B10H30B10H30B10H30B10H30B10H30B10H30B10H30B10H30B10H30B10H30B10H30B10H34B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B'
        + '2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B'
        + '2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H38B2H31B9H38B2H11B9H18B2H31B9H38B2H11B9H18B2H28B15H35B2H8B15H15B2H28B15H35B2H8B15H15B2H26B19H33B2H6B19H'
        + '13B2H26B20H32B2H6B19H13B2H23B25H30B2H3B25H10B2H23B25H30B2H3B25H10B2H21B29H28B2H1B29H8B2H21B29H28B2H1B30H7B2H20B31H27B33H7B2H20B31H27B35H5B2H18B35H25B35H5B2H18B35H25B37H3B2H16B39H21B40H2B2H16'
        + 'B40H20B44H13B45H15B47H13B45H15B48H9B51H9B51H9B51H9B1240D7200' },
    { id: "door", role: "movable", motion: "slide-x: opens by sliding left up to 26px behind the wall", x: 78, y: 12, w: 30, h: 61,
      data: 'B31E28B2E28B2E28B2E28B2E4C20E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4'
        + 'C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C1G18C1E4B2E4C20E4B2E28B2E28B2E28B2E28B2E1B2E25B2E1B2E25B2E1B2E25B2E1B2E25B2E1B2E25B2E1B2E25B2E1B2E25B2E1B2E25B2E1B2E25B2E28B2E28B2E28B2E2'
        + '8B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B2E28B31' },
    { id: "cabin", role: "static", x: 0, y: 0, w: 120, h: 80,
      data: 'F964C112F8C112F244I6F1I5B40I18F1I7A30I18F1I5B40I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B'
        + '2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A3'
        + '6B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2'
        + 'A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5'
        + 'B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B2A36B2I18F1I7A30I18F1I5B40I18F1I7A30I18F1I5B40I18F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1'
        + 'I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I18F1I63F1I7A30I12B7'
        + '8A30B12C78A30C90A30C90A30C90A30C90A30C90A30C852' },
    { id: "strap", role: "movable", motion: "swing: rotate around the pivot, about ±8 degrees", x: 56, y: 8, w: 10, h: 23, pivot: [60,9],
      data: 'A3F1J2F1A6F1J2F1A7J2A8J2A8J2A8J2A8J2A8J2A8J2A8J2A8J2A8J2A8J2A6F1J4F1A3F1J6F1A1F1J2A4J2F1J2A6J4A6J4A6J4A6J2F1J2A4J2F1A1F1J6F1A3F1J4F1A2' },
  ]
};

const els = PixelBuffer.sceneToSVG(document.getElementById('svg'), FIXTURE_TRAIN);

// `sky` is a background group: fill it dynamically (here: static bands,
// invisible behind the opaque scenery — kept to exercise the API).
els.sky.innerHTML = '<rect x="0" y="0" width="120" height="48" fill="#9cc8e8"/>'
  + '<rect x="0" y="48" width="120" height="32" fill="#88b088"/>';

const strapPivot = FIXTURE_TRAIN.layers.find(l => l.id === 'strap').pivot;

/* ---- animation: ?pose=<0..1> freezes one 8s door cycle ---- */
const poseParam = new URLSearchParams(location.search).get('pose');
const PERIOD = 8; // seconds per door open/close cycle
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function pose(t) {
  // scenery: constant scroll, wraps every 120px (strip is 240px wide)
  const scroll = -((t * 24) % 120);
  els.scenery.setAttribute('transform', 'translate(' + scroll.toFixed(2) + ' 0)');

  // door: open (slide left 26px), hold, close, hold
  const c = (t % PERIOD) / PERIOD;
  let open; // 0 = closed, 1 = fully open
  if (c < 0.25) open = c / 0.25;
  else if (c < 0.5) open = 1;
  else if (c < 0.75) open = 1 - (c - 0.5) / 0.25;
  else open = 0;
  open = open * open * (3 - 2 * open); // smoothstep
  els.door.setAttribute('transform', 'translate(' + (-26 * open).toFixed(2) + ' 0)');

  // strap: pendulum around the pivot from the manifest
  const a = 8 * Math.sin(t * 2.4);
  els.strap.setAttribute('transform',
    'rotate(' + a.toFixed(2) + ' ' + strapPivot[0] + ' ' + strapPivot[1] + ')');
}

if (poseParam !== null) {
  pose(parseFloat(poseParam) * PERIOD);
} else if (reduced) {
  pose(0);
} else {
  (function tick() {
    pose(performance.now() / 1000);
    requestAnimationFrame(tick);
  })();
}
</script>
</body>
</html>
