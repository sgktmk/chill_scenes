<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SCENE_TITLE}} — Chill Scenes</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="/shared/scene-ui.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06060e}
body{display:flex;align-items:center;justify-content:center;font-family:monospace;color:#ccd}

#scene-wrap{
  position:relative;
  width:100vw;height:56.25vw;
  max-height:100vh;max-width:177.78vh;
  overflow:hidden;cursor:default;
}
#scene-wrap svg,.overlay-svg{
  display:block;width:100%;height:100%;
  image-rendering:pixelated;
  image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges;
}
svg rect{shape-rendering:crispEdges}
.overlay-svg{position:absolute;top:0;left:0;pointer-events:none}

/* === SCENE-SPECIFIC CSS ANIMATIONS ===
   Add @keyframes for particle overlays (snow, rain, fireflies, etc.) here.
   Pattern:
     @keyframes particleA{0%{transform:translateY(-14px)}100%{transform:translateY(196px)}}
*/

@media(prefers-reduced-motion:reduce){
  .particle-dot{animation:none!important}
}
</style>
</head>
<body>
<a class="back" href="/">&#8592; Top</a>
<div id="scene-wrap">
  <svg id="scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"></svg>
</div>
<div class="ap">
  <button class="ab" id="aBtn"><span style="position:relative">🔇<span class="wi"><span></span><span></span><span></span></span></span></button>
  <input type="range" class="vs" id="vSl" min="0" max="100" value="40"/>
  <span class="vl" id="vLb">40%</span>
</div>

<script src="/shared/pixel.js"></script>
<script>
/* ===========================================================
   CONFIG
   =========================================================== */
const W = 320, H = 180;

/* 32-colour palette — grouped by purpose:
   0-7:   sky / atmosphere (dark → light)
   8-14:  ground / surface (shadow → highlight)
   15-20: primary scene elements (dark → light)
   21-25: light source / accent
   26-31: secondary / reserve */
const P = [
  /* TODO: Design palette for this scene */
  '#000000', // 0
];

/* ===========================================================
   PIXEL BUFFER (shared/pixel.js)
   =========================================================== */
const pb = new PixelBuffer(W, H, P);
const buf = pb.buf;
function rn() { return pb.rn(); }
function ri(a, b) { return pb.ri(a, b); }
function sp(x, y, c) { pb.sp(x, y, c); }
function fr(x0, y0, w, h, c) { pb.fr(x0, y0, w, h, c); }
function fe(cx, cy, rx, ry, c) { pb.fe(cx, cy, rx, ry, c); }
function ft(x0, y0, x1, y1, x2, y2, c) { pb.ft(x0, y0, x1, y1, x2, y2, c); }

/* ===========================================================
   SCENE-SPECIFIC DRAWING HELPERS
   =========================================================== */
/* TODO: Add reusable drawing functions for this scene's elements.
   Examples from existing scenes:
   - drawTree(cx, baseY, h, w, depth) in snowy-forest
   - Each function should accept depth (0=far, 1=mid, 2=near) to
     select appropriate palette colours. */

/* ===========================================================
   ANIMATABLE ELEMENT TRACKING
   =========================================================== */
/* TODO: Record pixel positions of elements that need animation.
   Pattern:
     const animPixels = [];
     // ... inside drawing code ...
     animPixels.push({ x, y, baseC: c });
*/

/* ===========================================================
   PAINT SCENE — Standard depth-layered order
   =========================================================== */
function paintScene() {
  pb.seed(12345);
  pb.clear(0);

  /* 1. SKY — vertical gradient (6-8 bands)
     for (let y = 0; y < H; y++) {
       let c;
       if (y < 8) c = 0; else if (y < 18) c = 1; ...
       for (let x = 0; x < W; x++) sp(x, y, c);
     } */

  /* 2. CELESTIAL — stars, moon/sun (record positions for animation) */

  /* 3. DISTANT FEATURES — mountains, far skyline
     Use sine waves for organic shapes:
       let mh = 74 + Math.sin(x*0.012)*16 + Math.sin(x*0.035)*10; */

  /* 4. FAR ELEMENTS (depth=0) — small, dim, high Y (80-100)
     for (let i = 0; i < 30; i++) { ... } */

  /* 5. GROUND / WATER — stratified gradient fill + noise */

  /* 6. LIGHT EFFECTS — reflections, glow on existing pixels
     Read current pixel with buf[y*W+x], conditionally brighten */

  /* 7. TEXTURE PASS — 300-500 random perturbations (±1 index) */

  /* 8. MID ELEMENTS (depth=1) — medium size, Y 100-120
     for (let i = 0; i < 20; i++) { ... } */

  /* 9. DETAIL — footprints, small objects, environmental detail */

  /* 10. NEAR ELEMENTS (depth=2) — large, dark, framing left+right */
}

/* ===========================================================
   SVG RENDER (via shared/pixel.js)
   =========================================================== */
function render() {
  /* Simple (no animation layers): */
  pb.toSVG(document.getElementById('scene'));

  /* With animation layers:
  const animSet = new Set(animPixels.map(p => p.y * W + p.x));
  pb.toSVG(document.getElementById('scene'), {
    layers: ['anim-layer-id'],
    classify(x, y, idx) {
      if (animSet.has(idx)) return 'anim-layer-id';
      return null;
    }
  }); */
}

/* ===========================================================
   ANIMATIONS
   =========================================================== */
let animFrame;
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function startAnimations() {
  if (reducedMotion) return;

  let t0 = performance.now();
  function tick(now) {
    let t = (now - t0) / 1000;

    /* Brightness shimmer pattern (for light sources):
       let bright = 1.0 + Math.sin(t*0.4)*0.06 + Math.sin(t*0.7+1)*0.04;
       el.style.filter = 'brightness(' + bright.toFixed(3) + ')'; */

    /* Per-element twinkle pattern (for stars):
       for (let s of stars) {
         let phase = t / s.speed + s.phase;
         let brightness = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(phase * 6.2832));
         ...
       } */

    animFrame = requestAnimationFrame(tick);
  }
  animFrame = requestAnimationFrame(tick);
}

/* === PARTICLE OVERLAY ===
   CSS-animated SVG overlay for snow, rain, fireflies, etc.
   Pattern from snowy-forest:
function mkParticles() {
  const wrap = document.getElementById('scene-wrap');
  function layer(n, szMin, szMax, spMin, spMax, op) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    s.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    s.classList.add('overlay-svg');
    let h = '';
    for (let i = 0; i < n; i++) {
      let x = Math.random() * W, y = Math.random() * H;
      let sz = Math.floor(szMin + Math.random() * (szMax - szMin + 1));
      let dur = (spMin + Math.random() * (spMax - spMin)).toFixed(1);
      let del = (Math.random() * spMax).toFixed(1);
      let an = 'particleA'; // choose from defined @keyframes
      h += '<rect class="particle-dot" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+
           '" width="'+sz+'" height="'+sz+'" fill="'+P[14]+
           '" opacity="0.4" style="animation:'+an+' '+dur+'s linear -'+del+'s infinite"/>';
    }
    s.innerHTML = h;
    wrap.appendChild(s);
  }
  layer(50, 1, 1, 8, 14, 0.35);  // far: many small slow
  layer(25, 1, 2, 5, 8, 0.65);   // near: fewer larger faster
} */

/* ===========================================================
   AUDIO — Procedural Web Audio
   =========================================================== */
let audioCtx = null, masterGain = null;
/* let timers for scheduled sounds: owlTimer, etc. */

function makeNoiseSrc(ac) {
  const sz = ac.sampleRate * 2;
  const abuf = ac.createBuffer(1, sz, ac.sampleRate);
  const d = abuf.getChannelData(0);
  for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  src.buffer = abuf;
  src.loop = true;
  return src;
}

function startAudio(vol) {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(vol / 100 * 0.45, audioCtx.currentTime);
  masterGain.connect(audioCtx.destination);

  /* --- Base Drone: looping noise + lowpass/bandpass filter ---
  const src = makeNoiseSrc(audioCtx);
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass'; filt.frequency.value = 200;
  const g = audioCtx.createGain(); g.gain.value = 0.03;
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(); */

  /* --- Texture: highpass filtered noise ---
  const hp = makeNoiseSrc(audioCtx);
  const hpF = audioCtx.createBiquadFilter();
  hpF.type = 'highpass'; hpF.frequency.value = 3200;
  const hpG = audioCtx.createGain(); hpG.gain.value = 0.018;
  hp.connect(hpF); hpF.connect(hpG); hpG.connect(masterGain);
  hp.start(); */

  /* --- Periodic Sound: scheduled with jitter ---
  schedulePeriodicSound(); */
}

/* Periodic sound scheduling pattern:
function schedulePeriodicSound() {
  timer = setTimeout(() => {
    if (!audioCtx) return;
    if (Math.random() < 0.75) playPeriodicSound();
    schedulePeriodicSound();
  }, 10000 + Math.random() * 20000);
}

function playPeriodicSound() {
  const ac = audioCtx, t = ac.currentTime;
  const osc = ac.createOscillator();
  const g = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(340, t);
  osc.frequency.exponentialRampToValueAtTime(280, t + 0.5);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.10, t + 0.07);
  g.gain.linearRampToValueAtTime(0, t + 0.7);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t + 0.75);
} */

function stopAudio() {
  /* Clear all scheduled timers:
  clearTimeout(owlTimer); owlTimer = null; */
  if (audioCtx) { audioCtx.close(); audioCtx = null; masterGain = null; }
}

function setVolume(v) {
  if (masterGain) masterGain.gain.setValueAtTime(v / 100 * 0.45, audioCtx.currentTime);
}

/* ===========================================================
   INIT
   =========================================================== */
paintScene();
render();
startAnimations();
/* mkParticles(); */
</script>
<script src="/shared/scene-ui.js"></script>
<script>
initSceneAudio({
  onStart(v)        { startAudio(v); },
  onStop()          { stopAudio(); },
  onVolumeChange(v) { setVolume(v); },
});
</script>
</body>
</html>
