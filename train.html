    for (let x = STRAPS[i][0]; x <= STRAPS[i][1]; x++) {
      const idx = y * 320 + x;
      if (LUMA[pb.buf[idx]] > LUMA_THRESH) {
        brightBackup.set(idx, pb.buf[idx]);
        pb.buf[idx] = CEIL;
      }
    }
  }
}
const svgEl = document.getElementById('svg');
pb.toSVG(svgEl);
const bgHTML = svgEl.innerHTML;

// Step 2: Restore bright pixels, classify only bright pixels → strap layers
for (const [idx, c] of brightBackup) pb.buf[idx] = c;
pb.toSVG(svgEl, {
  layers: STRAPS.map((_, i) => `strap-${i}`),
  classify(x, y) {
    if (y < STRAP_Y) {
      for (let i = 0; i < STRAPS.length; i++) {
        if (x >= STRAPS[i][0] && x <= STRAPS[i][1] && LUMA[pb.gp(x,y)] > LUMA_THRESH)
          return `strap-${i}`;
      }
    }
    return null;
  }
});

// Step 3: Complete background + bright strap pixels on top
const strapHTML = STRAPS.map((_, i) =>
  svgEl.querySelector(`#strap-${i}`)?.outerHTML || ''
).join('');
svgEl.innerHTML = bgHTML + strapHTML;

// Step 4: Apply animation to each strap group
STRAPS.forEach((_, i) => {
  const g = svgEl.querySelector(`#strap-${i}`);
  if (!g) return;
  g.style.transformOrigin = '50% 0%';
  const dur = (2.8 + i * 0.18).toFixed(2) + 's';
  g.style.animation = `strap-sway ${dur} ease-in-out infinite alternate`;
  g.style.animationDelay = (i * 0.45).toFixed(2) + 's';
});

/* ---- Audio ---- */
(function() {
  let ctx, master, started = false;

  function buildAudio(vol) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = vol;
    master.connect(ctx.destination);

    // --- Low rumble: brown noise through low-pass ---
    const rumbleLen = ctx.sampleRate * 3;
    const rumbleBuf = ctx.createBuffer(1, rumbleLen, ctx.sampleRate);
    const rd = rumbleBuf.getChannelData(0);
    let lastB = 0;
    for (let i = 0; i < rumbleLen; i++) {
      const white = Math.random() * 2 - 1;
      lastB = (lastB + 0.02 * white) / 1.02;
      rd[i] = lastB * 18;
    }
    const rumbleSrc = ctx.createBufferSource();
    rumbleSrc.buffer = rumbleBuf;
    rumbleSrc.loop = true;
    const rumbleLp = ctx.createBiquadFilter();
    rumbleLp.type = 'lowpass';
    rumbleLp.frequency.value = 90;
    const rumbleGain = ctx.createGain();
    rumbleGain.gain.value = 0.55;
    rumbleSrc.connect(rumbleLp);
    rumbleLp.connect(rumbleGain);
    rumbleGain.connect(master);
    rumbleSrc.start();

    // --- Mid-freq carriage sway: band-pass noise ---
    const swayLen = ctx.sampleRate * 2;
    const swayBuf = ctx.createBuffer(1, swayLen, ctx.sampleRate);
    const sd = swayBuf.getChannelData(0);
    let lastS = 0;
    for (let i = 0; i < swayLen; i++) {
      const white = Math.random() * 2 - 1;
      lastS = (lastS + 0.04 * white) / 1.04;
      sd[i] = lastS * 12;
    }
    const swaySrc = ctx.createBufferSource();
    swaySrc.buffer = swayBuf;
    swaySrc.loop = true;
    const swayBp = ctx.createBiquadFilter();
    swayBp.type = 'bandpass';
    swayBp.frequency.value = 220;
    swayBp.Q.value = 0.6;
    const swayGain = ctx.createGain();
    swayGain.gain.value = 0.2;
    swaySrc.connect(swayBp);
    swayBp.connect(swayGain);
    swayGain.connect(master);
    swaySrc.start();

    // --- Rail joint clicks: periodic transients ---
    let nextClick = ctx.currentTime + 0.05;
    const BPM = 4.8; // clicks per second (~100 km/h feel)
    function scheduleClicks() {
      while (nextClick < ctx.currentTime + 0.3) {
        const clickBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.04), ctx.sampleRate);
        const cd = clickBuf.getChannelData(0);
        for (let i = 0; i < cd.length; i++) {
          cd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (cd.length * 0.15));
        }
        const clickSrc = ctx.createBufferSource();
        clickSrc.buffer = clickBuf;
        const clickHp = ctx.createBiquadFilter();
        clickHp.type = 'highpass';
        clickHp.frequency.value = 800;
        const clickGain = ctx.createGain();
        clickGain.gain.value = 0.35;
        clickSrc.connect(clickHp);
        clickHp.connect(clickGain);
        clickGain.connect(master);
        // slight rhythm variation
        const interval = 1 / BPM * (0.92 + Math.random() * 0.16);
        clickSrc.start(nextClick);
        nextClick += interval;
      }
      setTimeout(scheduleClicks, 150);
    }
    scheduleClicks();
  }

  function stopAudio() {
    if (ctx) { ctx.close(); ctx = null; started = false; }
  }

  initSceneAudio({
    onStart(vol) {
      if (!started) { buildAudio(vol); started = true; }
      else if (ctx && ctx.state === 'suspended') ctx.resume();
    },
    onStop() { stopAudio(); },
    onVolumeChange(vol) {
      if (master) master.gain.value = vol;
    }
  });
})();
</script>
